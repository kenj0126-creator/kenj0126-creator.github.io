name: Deploy site to GitHub Pages

# 2026-10-28: GitHub Pages での公開を終了し、旧版の終了案内（retired/）だけを配信する。
# 日次の原稿（handoff/daily/）の push では配信を行わない。
on:
  push:
    branches: [main]
    paths:
      - 'retired/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload retired/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: retired

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
